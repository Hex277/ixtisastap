name: Obfuscate JavaScript

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu yoxla
        uses: actions/checkout@v4

      - name: Node.js quraşdır
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obfuscator alətini yüklə
        run: npm install -g javascript-obfuscator

      - name: Kodları qarışdır (Obfuscate)
        run: |
          mkdir -p dist
          javascript-obfuscator ./js --output ./dist --compact true --self-defending true --control-flow-flattening true --dead-code-injection true

      - name: Dəyişiklikləri GitHub-a geri yüklə (Optional)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m "Build: Kodlar qarışdırıldı və sıxıldı" || echo "Dəyişiklik yoxdur"
          git push