name: Obfuscate JavaScript

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu yoxla
        uses: actions/checkout@v4

      - name: Node.js quraşdır
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Çıxış qovluqlarını yarat
        run: mkdir -p dist/telebe

      - name: Root-dakı JS-ləri qarışdır
        run: |
          for file in *.js; do
            if [ -f "$file" ]; then
              npx javascript-obfuscator "$file" --output "dist/$file" --compact true --self-defending true
            fi
          done

      - name: Telebe qovluğundakı JS-ləri qarışdır
        run: |
          if [ -d "telebe" ]; then
            npx javascript-obfuscator ./telebe --output ./dist/telebe --compact true --self-defending true
          fi

      - name: Dəyişiklikləri GitHub-a geri yüklə
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m "Build: Bütün JS-lər (root + telebe) qarışdırıldı" || echo "Dəyişiklik yoxdur"
          git push